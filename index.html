<style>
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@property --p{syntax:"<number>";inherits:false;initial-value:0}
:root{color-scheme:light dark;--bg:#f3f6fc;--card:#fff;--ink:#0a1a3d;--mut:#5a6785;--line:#e0e6f3;--br:#0f3a94;--br2:#0f3a94;--or:#fe7c03;--ort:#b84f00;--soft:#e9effc;--softw:#ffeedd;--bor:#cfdaf3;--softg:#e1eaff;--red:#d92d3f;--softr:#ffe5e9;--warn:#b84f00;--softy:#ffe3c4;--yel:#a64600;--on:#fff;--on2:#fff;--grad:linear-gradient(135deg,#fe8a1a,#fd6500);--sh:0 1px 2px rgba(0,30,82,.06),0 12px 32px -10px rgba(0,30,82,.2);--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#050e26;--card:#0c1a42;--ink:#eef3ff;--mut:#9aa9d0;--line:#1c2c63;--br:#8fb2ff;--br2:#9dbcff;--or:#ff8a1f;--ort:#ffa04d;--soft:#14245a;--softw:#3a2209;--bor:#27397b;--softg:#12285f;--red:#ff8496;--softr:#3d1421;--warn:#ffb26b;--softy:#40250c;--yel:#ffc58f;--on2:#050e26;--sh:0 1px 2px rgba(0,0,0,.5),0 14px 34px -12px rgba(0,0,0,.65)}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:clamp(16px,.4vw + 15px,18px)/1.5 "Inter var",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-wrap:pretty;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:62vmax;height:62vmax;border-radius:50%;filter:blur(80px);pointer-events:none}
body::before{top:-26vmax;left:-22vmax;background:radial-gradient(circle,#fe8a1a,transparent 66%);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
body::after{bottom:-30vmax;right:-24vmax;background:radial-gradient(circle,#2f5bd8,#fe7c03 60%,transparent 72%);opacity:.32;animation:drift 28s ease-in-out infinite alternate-reverse}
@media(prefers-color-scheme:dark){body::before{opacity:.28}body::after{opacity:.16}}
@keyframes drift{to{transform:translate(9vmax,7vmax) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes fade{from{opacity:0}}
@keyframes flow{to{background-position:-200% 0}}
@keyframes spin{to{--a:360deg}}
.wrap{max-width:560px;margin:0 auto;padding:6px 16px 130px;container-type:inline-size}
.bar0{display:flex;align-items:center;gap:12px;padding:12px 2px 6px;animation:rise .6s var(--ease) both}
.lg{width:44px;height:44px;border-radius:15px;background:var(--grad);display:grid;place-items:center;box-shadow:0 10px 22px -8px rgba(254,124,3,.7);flex:none}.lg svg{width:30px;height:30px}
.bar0 b{font-size:20px;letter-spacing:-.4px;font-weight:800}
.bar0 b i{font-style:normal;font-size:11.5px;background:var(--grad);color:var(--on);border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:3px}
.rt{margin-left:auto;display:flex;gap:8px;align-items:center}
.tag{background:var(--softy);color:var(--yel);font-size:11.5px;font-weight:800;border-radius:99px;padding:3px 10px}
.hb{border:1.5px solid var(--bor);background:var(--soft);color:var(--br);border-radius:99px;min-height:38px;padding:4px 14px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:transform .25s var(--spring)}.hb:active{transform:scale(.93)}
#app.anim>*{animation:rise .55s var(--ease) both}
#app.anim>:nth-child(2){animation-delay:.06s}#app.anim>:nth-child(3){animation-delay:.12s}#app.anim>:nth-child(4){animation-delay:.18s}#app.anim>:nth-child(n+5){animation-delay:.24s}
.card{position:relative;background:var(--card);background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border:1px solid var(--line);border-radius:26px;padding:20px;margin:14px 0;box-shadow:var(--sh)}
h2{margin:0 0 4px;font-size:22px;letter-spacing:-.5px;font-weight:800;text-wrap:balance}
.sub{margin:0 0 6px;color:var(--mut);font-size:14.5px}
.sec{display:flex;align-items:center;gap:8px;margin:24px 2px 10px;font-size:18px;font-weight:800}
label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:14px 0 6px;letter-spacing:.2px}
input,select{width:100%;min-height:50px;padding:12px 15px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);background:color-mix(in srgb,var(--bg) 60%,var(--card));color:var(--ink);font:inherit;font-size:16px;transition:border-color .2s,box-shadow .3s,background .2s}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:none;border-color:var(--br);box-shadow:0 0 0 4px rgba(255,138,31,.25)}
input[type=checkbox]{accent-color:var(--br)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{position:relative;display:block;width:100%;min-height:54px;border:0;border-radius:18px;padding:14px 18px;font:inherit;font-weight:700;color:var(--on);background:var(--grad);cursor:pointer;margin-top:14px;text-align:center;text-decoration:none;box-shadow:0 12px 26px -12px rgba(254,124,3,.8),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .3s var(--spring),box-shadow .3s,filter .2s,opacity .2s}
.btn:active{transform:scale(.96)}
@media(hover:hover){.btn:hover{filter:brightness(1.07);transform:translateY(-2px)}.mc:hover{transform:translateY(-2px)}}
.btn.o{background:var(--soft);color:var(--br);box-shadow:none}
.btn.ghost{background:transparent;color:var(--mut);border:1.5px solid var(--line);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#c2364a,#9e2438);color:#fff}.btn.dng{background:transparent;color:var(--red);border:1.5px solid var(--red);box-shadow:none}
.btn.big{min-height:62px;font-size:18px}
.btn:disabled{opacity:.42;filter:saturate(.4);cursor:not-allowed;transform:none;box-shadow:none}
.btn.go:not(:disabled){animation:ring 1.8s ease-out infinite}
.nav2{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.pill{background:var(--soft);color:var(--br);border-radius:99px;padding:2px 12px;font-size:13px;font-weight:800}
.err{color:var(--red);font-size:14.5px;margin-top:12px;font-weight:700;animation:shake .4s}
@keyframes shake{25%{translate:-6px}50%{translate:6px}75%{translate:-3px}}
.steps{display:flex;margin:10px 0 2px}.s{flex:1;text-align:center;font-size:12.5px;color:var(--mut);position:relative}
.s b{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 4px;border-radius:50%;background:var(--line);color:var(--mut);font-size:14px;transition:all .4s var(--spring);position:relative;z-index:1}
.s:not(:last-child)::after{content:"";position:absolute;top:16px;left:calc(50% + 22px);right:calc(-50% + 22px);height:3px;border-radius:3px;background:var(--line)}.s.d:not(:last-child)::after{background:var(--br2)}
.s.c b{background:var(--grad);color:var(--on);scale:1.12;box-shadow:0 8px 18px -6px rgba(254,124,3,.7)}.s.c span{color:var(--ink);font-weight:800}.s.d b{background:var(--br2);color:var(--on2)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border:1.5px solid var(--line);border-radius:18px;padding:4px}
.seg button{border:0;background:none;min-height:46px;border-radius:14px;font:inherit;font-size:15px;font-weight:700;color:var(--mut);cursor:pointer;transition:all .3s var(--ease)}
.seg button.on{background:var(--grad);color:var(--on);box-shadow:0 8px 18px -8px rgba(254,124,3,.8)}
.amt{position:relative}.amt input{padding-right:46px;text-align:right;font-weight:700}
.amt i{position:absolute;right:12px;top:50%;translate:0 -50%;font-style:normal;font-size:10.5px;color:var(--mut)}
.amt.big input{font-size:26px;font-weight:800;min-height:62px;padding-right:62px}.amt.big i{font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);animation:rise .4s var(--ease) both}.row:last-child{border-bottom:0}
.x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;min-height:44px;min-width:32px;transition:transform .3s var(--spring),color .2s}.x:hover{color:var(--red);transform:rotate(90deg)}
.empty{text-align:center;color:var(--mut);padding:20px 0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.sum div{background:var(--soft);border-radius:18px;padding:12px 6px;text-align:center}.sum span{display:block;font-size:12px;color:var(--mut)}.sum b{font-size:15.5px;color:var(--br)}
.hero{background:linear-gradient(135deg,#001e52,#0a3278 55%,#134aa8);color:#fff;border:0;overflow:hidden;isolation:isolate;container-type:inline-size;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 24px 50px -20px rgba(0,30,82,.65)}
.hero::before{content:"";position:absolute;inset:-60%;z-index:-1;background:conic-gradient(from var(--a),transparent 0 25%,rgba(254,124,3,.45) 35%,transparent 50% 70%,rgba(120,160,255,.4) 85%,transparent);animation:spin 9s linear infinite}
.hero small{opacity:.85;font-size:13.5px}
.who{display:flex;align-items:center;gap:14px;margin:12px 0}
.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#0a3278,#001e52);color:#fff;font-weight:800;font-size:19px;display:grid;place-items:center;flex:none}
.hero .av{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.big{font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.6px}
.pot{display:inline-block;background:rgba(255,255,255,.16);border-radius:99px;padding:6px 16px;font-size:15px}.pot b{color:#ffb15c;font-size:18px}
.bar{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:16px 0 8px}
.bar b{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#fe7c03,#ffc27a,#fe7c03,#ffa04d);background-size:200% 100%;animation:flow 3s linear infinite;transition:width .8s var(--ease)}
.bl{display:flex;justify-content:space-between;font-size:13.5px}
@container (max-width:360px){.big{font-size:23px}.pot{font-size:13.5px}}

<div class="card"><h2>Exporter</h2><p class="sub">Le récapitulatif de toutes vos tontines.</p>${DEMO?lock("Export Excel et PDF"):`<button class="btn o" onclick="csvExport()">📊 Exporter pour Excel (.csv)</button><button class="btn o" onclick="report()">📄 Récapitulatif PDF</button><p class="hint">Pour le PDF, choisissez « Enregistrer au format PDF » dans la fenêtre d’impression.</p>`}</div>
${arch()}
<div class="card"><h2>Bon à savoir</h2><p class="sub">• Tontine 2.0 fonctionne dans votre navigateur, sans compte ni connexion.<br>• Vos données restent sur cet appareil et dans ce navigateur.<br>• Si vous changez de téléphone, restaurez votre sauvegarde.<br>• Ne partagez pas vos fichiers de sauvegarde : ils contiennent les noms et les montants de vos membres.</p></div>`}
function wzx(){return `<div class="card"><h2>Déjà utilisé Tontine 2.0 ?</h2><p class="sub">Retrouvez vos données sur ce téléphone grâce à une sauvegarde.</p>${DEMO?`<a class="btn o" href="${cta()}" target="_blank" rel="noopener">🔒 Restauration · version complète</a>`:`<button class="btn o" onclick="$('rf').click()">⬆️ Restaurer une sauvegarde</button><button class="btn ghost" onclick="pasteSheet()">📋 Coller le contenu d’une sauvegarde</button><input type="file" id="rf" hidden accept=".json,application/json" onchange="restore(this.files[0])">`}${ARCH.length?`<button class="btn ghost" onclick="view='arch';ai=-1;v()">📁 Mes tontines terminées (${ARCH.length})</button>`:""}${askReset==="rest"?cf("Remplacer vos données actuelles ?","Vos tontines terminées actuelles seront remplacées par celles de la sauvegarde.","Oui, restaurer","applyRestore()"):""}</div>`}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2200)}
function phone(p){let d=(p||"").replace(/\D/g,"");if(d.length===10)d="225"+d;return d}
const cta=()=>`https://wa.me/${WA}?text=${encodeURIComponent("Bonjour, je souhaite la version complète de Tontine 2.0.")}`;
const amt=i=>(S.pay[i]||[]).reduce((t,p)=>t+(+p.a||0),0);
const rest=i=>Math.max(0,S.amount-amt(i));
const totRest=()=>S.members.reduce((s,_,i)=>s+rest(i),0);
const coll=()=>S.members.reduce((s,_,i)=>s+Math.min(amt(i),S.amount),0);
const nbOk=()=>S.members.filter((_,i)=>rest(i)===0).length;

function addF(b,n,fq){const d=new Date(b+"T12:00:00");if(fq>=30){const j=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(j,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}else d.setDate(d.getDate()+n*fq);return d}
function autoEnd(b,fq){const d=addF(b,1,fq);d.setDate(d.getDate()-1);return iso(d)}
const shift=(b,i)=>addF(b,i,S.freq);
const due=i=>shift(S.start,i),beg=i=>shift(S.begin||S.start,i);
const lo=()=>iso(beg(S.round)),hi=()=>iso(due(S.round));
function fixDates(){if(!S||S.round>=S.members.length)return;const a=lo(),b=hi();let ch=0;for(const k in S.pay)for(const p of S.pay[k])if(p.d&&(p.d<a||p.d>b)){p.d=p.d<a?a:b;ch=1}if(ch)save()}
function dflt(){const t=today(),a=lo(),b=hi();return t<a?a:t>b?b:t}
const dl=(d,o)=>d.toLocaleDateString("fr-FR",o);

/* ===== Assistant de création ===== */

let h=`<div class="steps">${names.map((t,i)=>`<div class="s ${step>i+1?"d":step===i+1?"c":""}"><b>${step>i+1?"✓":i+1}</b><span>${t}</span></div>`).join("")}</div>`;
const E=err?`<div class="err">${err}</div>`:"";
if(step===1)h+=`<div class="card"><h2>Votre tontine</h2><p class="sub">Quelques infos et c’est parti.</p>
<label>Nom de la tontine</label><input value="${esc(D.name)}" oninput="D.name=this.value" placeholder="Ex : Tontine des Copines">
<label>Cotisation par membre et par tour</label><div class="amt big"><input type="number" inputmode="numeric" value="${D.amount}" oninput="D.amount=this.value" placeholder="10000"><i>FCFA</i></div>
<label>Fréquence</label><div class="seg">${[["7","Semaine"],["15","15 jours"],["30","Mois"]].map(([k,t])=>`<button class="${D.freq==k?"on":""}" onclick="D.freq='${k}';v()">${t}</button>`).join("")}</div>
<label>Début de la cotisation (1er tour)</label><input type="date" min="${today()}" value="${D.begin&&D.begin>=today()?D.begin:today()}" onchange="setBegin(this.value)"><div class="auto"><span>⏰ DATE LIMITE DE PAIEMENT</span><b>${dl(new Date(defFirst()+"T12:00:00"),{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</b><small>Calculée automatiquement selon la fréquence choisie.</small></div>${E}
<button class="btn g" onclick="n1()">Continuer</button></div>${wzx()}`;
else if(step===2){const full=DEMO&&D.members.length>=MAXD;
h+=`<div class="card"><h2>Les membres <span class="pill">${D.members.length}${DEMO?"/"+MAXD:""}</span></h2><p class="sub">Ajoutez au moins 3 personnes.</p>
${full?`<div class="demo">Limite de la démo atteinte (${MAXD} membres). <a href="${cta()}" target="_blank" rel="noopener">Version complète →</a></div>`:`<input id="mn" placeholder="Prénom / nom du membre" onkeydown="if(event.key==='Enter')addM()"><button class="btn o" onclick="addM()" style="margin-top:10px">+ Ajouter ce membre</button>`}
<div style="margin-top:10px">${D.members.map((m,i)=>`<div class="row"><span><b>${i+1}.</b> ${esc(m.n)}</span><button class="x" onclick="rmM(${i})" aria-label="Retirer ${esc(m.n)}">✕</button></div>`).join("")||'<div class="empty">Aucun membre pour l’instant</div>'}</div>${E}
<div class="nav2"><button class="btn ghost" onclick="step=1;err='';v()">Retour</button><button class="btn g" onclick="n2()">Continuer</button></div></div>`}
else{const n=D.members.length,a=+D.amount;
h+=`<div class="card"><h2>Tout est bon ?</h2><p class="sub">${esc(D.name)} · ${fmt(a)} ${D.freq==7?"chaque semaine":D.freq==15?"tous les 15 jours":"chaque mois"}</p>
<div class="sum"><div><span>Membres</span><b>${n}</b></div><div><span>Tours</span><b>${n}</b></div><div><span>Chaque tour</span><b>${fmt(a*n)}</b></div></div>
<label style="display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15.5px;font-weight:500;margin-top:16px"><input type="checkbox" style="width:22px;min-height:22px" ${D.shuffle?"checked":""} onchange="D.shuffle=this.checked"> 🎲 Tirer l’ordre de passage au sort</label>
<div class="nav2"><button class="btn ghost" onclick="step=2;v()">Retour</button><button class="btn g go" onclick="go()">🚀 Lancer</button></div></div>`}
return h}
function n1(){if(!D.name.trim())return fail("Donnez un nom à votre tontine.");if(!(+D.amount>0))return fail("Indiquez le montant de la cotisation.");err="";step=2;v()}
function n2(){if(D.members.length<3)return fail("Ajoutez au moins 3 membres.");err="";step=3;v()}
function setBegin(val){const t=today();if(!val||val<t){D.begin=t;if(val)toast("La date de début ne peut pas être antérieure à aujourd’hui.")}else D.begin=val;v(1)}
function fail(t){err=t;v(1)}
function addM(){const n=$("mn").value.trim();if(!n||(DEMO&&D.members.length>=MAXD))return;D.members.push({n,p:""});err="";v(1);if($("mn"))$("mn").focus()}
function rmM(i){D.members.splice(i,1);v(1)}
function go(){if(!D.begin||D.begin<today())D.begin=today();let m=D.members.slice();if(D.shuffle)for(let i=m.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[m[i],m[j]]=[m[j],m[i]]}
S={name:D.name.trim(),amount:+D.amount,freq:+D.freq,members:m,round:0,pay:{},history:[],start:defFirst(),begin:(D.begin&&D.begin>=today()?D.begin:today())};tab="tour";open=-1;save();v();toast("Tontine lancée 🎉");confetti()}

/* ===== Tableau de bord ===== */
function stTxt(i){const a=amt(i);if(!a)return["Rien payé · "+fmt(S.amount)+" à payer","r"];if(rest(i)>0)return[fmt(a)+" payés · reste "+fmt(rest(i)),"p"];return["✓ Soldé"+(a>S.amount?" (+"+fmt(a-S.amount)+")":""),"k"]}
function dueBox(){const d=due(S.round),b=beg(S.round),t0=new Date(today()+"T12:00:00"),n=Math.round((d-t0)/864e5),nb=Math.round((b-t0)/864e5);let t,c="";
if(nb>0)t="Ouvre dans "+nb+" jour"+(nb>1?"s":"");else if(n<0){t="En retard de "+(-n)+" jour"+(n<-1?"s":"");c="late"}else if(n===0){t="Dernier jour : aujourd’hui !";c="warn"}else{t="Plus que "+n+" jour"+(n>1?"s":"");if(n<=3)c="warn"}

return `<div class="mc ${o?"open":""}" id="mc${i}"><button class="mh" onclick="tg(${i})" aria-expanded="${o}"><div class="ring" id="rg${i}" style="--p:${Math.min(100,amt(i)/S.amount*100)}"><div class="av">${ini(m.n)}</div></div><div class="mi"><b>${esc(m.n)}${i===S.round?"<em>bénéficiaire</em>":""}</b><div class="stx ${c}" id="st${i}">${t}</div></div><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
${o?`<div class="mb"><div class="rng">📅 Dates acceptées : du <b>${dl(beg(S.round),{day:"numeric",month:"short"})}</b> au <b>${dl(due(S.round),{day:"numeric",month:"short"})}</b></div><div class="plh"><span>Montant versé (FCFA)</span><span>Date du versement</span><span></span></div><div id="pl${i}">${plHtml(i)}</div><div class="capn" id="cp${i}" hidden></div><div class="acts"><button class="sm addp ${rest(i)?"":"hide"}" id="ap${i}" onclick="addP(${i})">+ Versement</button><button class="sm solde ${rest(i)?"":"hide"}" id="so${i}" onclick="solder(${i})">✓ Solder le reste</button></div></div>`:""}</div>`}
function dash(){
const n=S.members.length,done=S.round>=n;
if(tab==="ordre")return ordre();if(tab==="hist")return hist();if(tab==="data")return data();
if(done)return `<div class="card hero"><small>${esc(S.name)}</small><div class="who"><div class="av">🎉</div><div class="big">Cycle terminé !</div></div><small>Tous les membres ont reçu leur tour. Bravo à tous !</small></div>${askReset==="new"?danger():`<button class="btn g big" onclick="ask('new')">＋ Nouvelle tontine</button>`}`;

return `<div class="card hero"><small>${esc(S.name)} · Tour ${S.round+1} sur ${n}</small><div class="who"><div class="av">${ini(b.n)}</div><div><small>Bénéficiaire</small><div class="big">${esc(b.n)}</div></div></div><div class="pot">Reçoit <b>${fmt(S.amount*n)}</b></div><div class="bar"><b id="bar"></b></div><div class="bl"><span>Collecté : <b id="col"></b></span><span>Reste : <b id="rst"></b></span></div></div>

<button class="btn g" id="nbtn" onclick="next()"></button><div class="hint" id="hint"></div>${shareBtn()}`}
function shareBtn(){if(DEMO)return `<a class="btn o" href="${cta()}" target="_blank" rel="noopener">🔒 Partager le récap WhatsApp · version complète</a>`;return `<a class="btn o" id="sh" target="_blank" rel="noopener" href="#">📤 Partager le récap sur WhatsApp</a>`}

return "https://wa.me/?text="+encodeURIComponent(`*${S.name}* — Tour ${S.round+1}/${n}\nBénéficiaire : ${S.members[S.round].n}\nCotisation : ${fmt(S.amount)}\nDate limite : ${dl(due(S.round),{day:"numeric",month:"long",year:"numeric"})}\n${l}\nReste à encaisser : ${fmt(totRest())}`)}
function ordre(){return `<div class="card"><h2>Ordre de passage</h2><p class="sub">Chaque tour a sa date limite de paiement.</p><div class="tl">${S.members.map((m,i)=>`<div class="tr"><span class="dot ${i<S.round?"done":i===S.round?"now":""}">${i<S.round?"✓":i+1}</span><div class="mi"><b>${esc(m.n)}</b><small>${i<S.round?"A déjà reçu":"Cotisation du "+dl(beg(i),{day:"numeric",month:"short"})+" au "+dl(due(i),{day:"numeric",month:"short"})}</small></div>${i===S.round?'<span class="pill">En cours</span>':""}</div>`).join("")}</div></div>`}

${danger()}`}

/* ===== Actions ===== */
function tg(i){open=open===i?-1:i;v(2)}
function setA(i,k,val,el){let a=Math.max(0,+val||0);const p=S.pay[i][k],mx=Math.max(0,S.amount-(amt(i)-(+p.a||0)));let big=0;if(a>mx){a=mx;big=1;if(el)el.value=mx||""}p.a=a||"";if(a&&!p.d){p.d=dflt();const e=$("d"+i+"_"+k);if(e)e.value=p.d}save();refresh(i);capNote(i,big?capMsg(mx):"")}
let capT={};
function capNote(i,t){const e=$("cp"+i);if(!e)return;clearTimeout(capT[i]);e.hidden=!t;e.textContent=t;if(t)capT[i]=setTimeout(()=>{e.hidden=true},5000)}
function setD(i,k,val){let d=val,bad=0;if(!d||d<lo()||d>hi()){d=!d?dflt():(d<lo()?lo():hi());bad=1}S.pay[i][k].d=d;save();if(bad){const e=$("d"+i+"_"+k);if(e)e.value=d;toast("Date hors période : choisissez entre le "+dl(beg(S.round),{day:"numeric",month:"short"})+" et le "+dl(due(S.round),{day:"numeric",month:"short"}))}}
function addP(i){S.pay[i].push({a:"",d:dflt()});save();$("pl"+i).innerHTML=plHtml(i);const x=$("pl"+i).querySelectorAll("input[type=number]"),l=x[x.length-1];if(l)l.focus()}

function solder(i){const r=rest(i);if(!r)return;const e=S.pay[i].find(p=>!(+p.a));if(e){e.a=r;e.d=e.d||dflt()}else S.pay[i].push({a:r,d:dflt()});save();v(1);toast("✓ "+fmt(r)+" enregistrés pour "+S.members[i].n)}
function refreshG(){const n=S.members.length,ok=totRest()===0,b=$("nbtn");if(!b)return;
$("col").textContent=fmt(coll());$("rst").textContent=fmt(totRest());$("bar").style.width=coll()/(S.amount*n)*100+"%";$("cnt").textContent=nbOk()+"/"+n+" soldés";
b.classList.toggle("go",ok);b.disabled=!ok;b.textContent=ok?"✓ Clôturer le tour et passer au suivant":"Reste "+fmt(totRest())+" à encaisser";
$("hint").textContent=ok?"":"Le tour suivant s’ouvre quand tout le monde a soldé sa cotisation.";
const sh=$("sh");if(sh)sh.href=shHref()}
function refresh(i){const[t,c]=stTxt(i),s=$("st"+i);if(s){s.textContent=t;s.className="stx "+c}
$("rg"+i).style.setProperty("--p",Math.min(100,amt(i)/S.amount*100));
for(const p of["ap","so"]){const e=$(p+i);if(e)e.classList.toggle("hide",rest(i)===0)}
refreshG()}
function next(){if(totRest()>0)return;const n=S.members.length;const W={n:S.members[S.round].n,p:S.amount*n,r:S.round+1,t:n,d:dl(new Date(),{weekday:"long",day:"numeric",month:"long",year:"numeric"}),last:S.round+1>=n};S.history.push({r:S.round+1,n:S.members[S.round].n,p:S.amount*n,pay:S.members.map((m,i)=>({n:m.n,a:amt(i),v:(S.pay[i]||[]).filter(p=>+p.a>0).map(p=>({a:+p.a,d:p.d||""}))}))});S.round++;S.pay={};open=-1;save();v();winner(W)}
function ask(k){askReset=k;v(1);if(k)setTimeout(()=>{const e=$("dz");if(e)e.scrollIntoView({behavior:"smooth",block:"center"})},50)}
function reset(){const nw=askReset==="new",old=S;if(nw&&old){ARCH.push(Object.assign({},old,{ended:new Date().toISOString()}));saveA()}
S=null;askReset="";step=1;tab="tour";open=-1;view="";ai=-1;D=nw&&old?{name:old.name,amount:String(old.amount),freq:String(old.freq),first:"",begin:"",shuffle:true,members:old.members.map(m=>({n:m.n,p:""}))}:{name:"",amount:"",freq:"30",first:"",begin:"",shuffle:true,members:[]};try{localStorage.removeItem(KEY)}catch(e){}v();toast(nw?"✓ Tontine conservée dans « Mes tontines »":"Tontine supprimée")}
function danger(){const done=S.round>=S.members.length,nw=askReset==="new";
if(askReset)return `<div class="card dz" id="dz"><h2>${nw?"Démarrer une nouvelle tontine ?":"Supprimer cette tontine ?"}</h2><p class="sub">${nw?"Elle sera conservée dans « Mes tontines » (onglet Données). Vous repartirez avec les mêmes membres, que vous pourrez modifier.":"Les membres, les versements et l’historique seront effacés définitivement. <b>Cette action est irréversible.</b> Conseil : téléchargez d’abord une sauvegarde (onglet Données)."}</p><div class="nav2"><button class="btn ghost" onclick="ask('')">Annuler</button><button class="btn ${nw?"g":"red"}" onclick="reset()">${nw?"Oui, continuer":"Oui, supprimer"}</button></div></div>`;
return `<div class="card dz"><h2>Zone sensible</h2><p class="sub">Supprimer cette tontine${done?"":" en cours"} et tout son contenu.</p><button class="btn dng" onclick="ask('del')">🗑 Supprimer cette tontine</button></div>`}

const IC={tour:'<path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/>',ordre:'<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/>',hist:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/>',data:'<path d="M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3zM4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'};
